name: release

# release-plz creates the tag and GitHub Release with GITHUB_TOKEN, and GitHub
# suppresses workflow triggers for events raised by GITHUB_TOKEN. So neither
# `push: tags` nor `release: published` fires for an automated release — this
# workflow has to be *called* by release-plz.yml instead. The `push: tags`
# trigger is kept for hand-pushed tags; `workflow_dispatch` is the manual
# retry path.
on:
  workflow_call:
    inputs:
      ref:
        description: Tag to publish from.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish from, e.g. v0.1.2.
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  # Builds first, publishes to crates.io last: crates.io can never be
  # unpublished or amended, so it must not run until the release artifacts
  # exist and are attached to the GitHub Release.
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          NAME="ruoqa-mcp-${TAG}-${{ matrix.target }}"
          mkdir "$NAME"
          strip target/release/ruoqa-mcp -o "$NAME/ruoqa-mcp"
          cp README.md COPYING "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruoqa-mcp-${{ matrix.target }}
          path: |
            ruoqa-mcp-*.tar.gz
            ruoqa-mcp-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          REPO="${{ github.repository }}"
          if out=$(gh release view "$TAG" --repo "$REPO" --json tagName 2>&1); then
            echo "::notice::Release $TAG already exists; reusing it."
          elif printf '%s' "$out" | grep -qi 'release not found'; then
            gh release create "$TAG" --repo "$REPO" --generate-notes --verify-tag
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber dist/*

  publish:
    needs: assets
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write     # OIDC exchange — required
      contents: read      # setting any permissions zeroes the rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on `push`, where checkout falls back to the pushed tag.
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # A retry, a hand-pushed tag racing the automated call, or GitHub's
      # at-least-once push delivery can run this job twice for one version.
      # crates.io rejects the loser with "already uploaded"/"already exists";
      # treat that as a no-op instead of a failed run.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          output=$(cargo publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qE 'already (uploaded|exists)'; then
            echo "::notice::Version already published to crates.io; treating as no-op."
            exit 0
          fi
          exit $status
